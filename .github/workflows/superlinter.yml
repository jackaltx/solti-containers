---
name: Super-Linter

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
  workflow_dispatch:

jobs:
  super-lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter@v4
        env:
          DEFAULT_BRANCH: test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          # Disable linters handled by dedicated workflows or not needed
          VALIDATE_MARKDOWN: false
          VALIDATE_BASH: false
          # Exclude docs directory, Jinja2 templates, and saved legacy code from linting
          FILTER_REGEX_EXCLUDE: "(docs/.*)|(.*\\.j2$)|(library\\.sav/.*)"
