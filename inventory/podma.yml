---
# Container services inventory for solti-podman collection
# Used by manage-svc.sh
#
# Pattern: Central host registry + capability groups
# - Top level 'mylab' group = central host registry (all known service hosts)
# - Children groups = service capabilities (mattermost_svc, redis_svc, etc.)
# - Hosts can belong to multiple capability groups
# - When targeting specific host with -h, it inherits all group vars from its capability groups

all:
  children:
    # ................................................
    mylab:
      # .........................................
      # mylab hosts
      hosts:
        #  For this example there is one and only one test host.

        podma:
          ansible_host: "podma.{{ domain }}"

          ansible_user: lavender # SSH user
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519 # SSH key

      # .........................................
      # mylab vars
      vars:
        mylab_results: []

      children:
        # ========================================
        mattermost_svc:
          hosts:
            podma:
              # host_vars
              mattermost_svc_name: "mm-podma"

        # ========================================
        elasticsearch_svc:
          hosts:
            podma:
              # host_vars
              elasticsearch_svc_name: "elasticsearch-podma"
              elasticsearch_alt_svc_name: "es-podma"

        # ========================================
        redis_svc:
          hosts:
            podma:
              # host_vars
              redis_svc_name: "redis-ui-podma"

        # ========================================
        hashivault_svc:
          hosts:
            podma:
              # host_vars
              hashivault_svc_name: "vault-podma"
              hashivault_alt_svc_name: "hashivault-podma"

        # ========================================
        traefik_svc:
          hosts:
            podma:
              # host_vars
              traefik_svc_name: "traefik-podma"

        # ========================================
        minio_svc:
          hosts:
            podma:
              minio_api_svc_name: "minio-podma"
              minio_console_svc_name: "minio-console-podma" # Console is built-in, this is just for Traefik routing

        # ========================================
        grafana_svc:
          hosts:
            podma:
              grafana_svc_name: "grafana-podma"

        # ========================================
        gitea_svc:
          hosts:
            podma:
              gritea_svc_name: "gitea-podma"

        # ========================================
        influxdb3_svc:
          hosts:
            podma:
              influxdb3_svc_name: "influxdb3-podma"

        # ========================================
        mongodb_svc:
          hosts:
            podma:
              # host_vars
              mongodb_svc_name: "mongodb-podma"

        # ========================================
        obsidian_svc:
          hosts:
            podma:
              # host_vars
              obsidian_svc_name: "obsidian-podma"

        # ========================================
        conduit_svc:
          hosts:
            firefly:
              # host_vars
              conduit_svc_name: "conduit-podma"
