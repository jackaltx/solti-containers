---
# Shared variables for redis_svc group
# Host-specific overrides (redis_svc_name) remain in inventory files

debug_level: warn
redis_data_dir: "{{ lookup('env', 'HOME') }}/redis-data"
# Credentials from HashiVault — path: kv/infrastructure/<inventory_hostname>/redis
redis_password: "{{ lookup('community.hashi_vault.hashi_vault',
    'kv/data/infrastructure/' + inventory_hostname + '/redis',
    auth_method='token',
    token=lookup('env', 'VAULT_TOKEN'),
    url=lookup('env', 'VAULT_ADDR')).password }}"

test_key: "test:ansible"
test_value: "Verification-{{ lookup('pipe', 'date +%s') }}"
