---
# Shared variables for mongodb_svc group
# Host-specific overrides (mongodb_svc_name) remain in inventory files

debug_level: warn
mongodb_data_dir: "{{ lookup('env', 'HOME') }}/mongodb-data"
mongodb_gui_port: 8082

# Credentials from HashiVault — path: kv/infrastructure/<inventory_hostname>/mongodb
mongodb_root_username: "{{ lookup('community.hashi_vault.hashi_vault',
    'kv/data/infrastructure/' + inventory_hostname + '/mongodb',
    auth_method='token',
    token=lookup('env', 'VAULT_TOKEN'),
    url=lookup('env', 'VAULT_ADDR')).root_user }}"
mongodb_root_password: "{{ lookup('community.hashi_vault.hashi_vault',
    'kv/data/infrastructure/' + inventory_hostname + '/mongodb',
    auth_method='token',
    token=lookup('env', 'VAULT_TOKEN'),
    url=lookup('env', 'VAULT_ADDR')).root_password }}"
mongodb_database: "{{ lookup('env', 'MONGODB_DATABASE', default='admin') }}"

# Test/verification variables
test_collection: "test_ansible"
test_document: '{"test": "verification", "timestamp": "{{ lookup(''pipe'', ''date +%s'') }}"}'

# Traefik integration
mongodb_enable_traefik: true
