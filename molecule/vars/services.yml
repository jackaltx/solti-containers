---
# Service definitions for solti-podman molecule testing.
# verify_role_tasks is an ordered list of role tasks — sequence is the semantics.
# Initialization, unsealing, and health checks all go here in the right order.
# required_packages removed — proxmox scenario targets a pre-provisioned VM.

container_services:
  traefik:
    roles: [traefik]
    verify_role_tasks: [verify.yml]
    service_names: [traefik-pod, traefik-svc]
    service_ports: [8080, 443]

  hashivault:
    roles: [hashivault]
    verify_role_tasks:
      - initialize.yml
      - unseal.yml
      - verify.yml
    service_names: [vault-pod, vault-svc]
    service_ports: [8200]

  redis:
    roles: [redis]
    verify_role_tasks: [verify.yml]
    service_names: [redis-pod, redis-svc, redis-gui]
    service_ports: [6379]

  elasticsearch:
    roles: [elasticsearch]
    verify_role_tasks: [verify.yml]
    service_names: [elasticsearch-pod, elasticsearch-svc, elasticsearch-gui]
    service_ports: [9200, 9300]

  minio:
    roles: [minio]
    verify_role_tasks: [verify.yml]
    service_names: [minio-pod, minio-svc]
    service_ports: [9000, 9001]

  mattermost:
    roles: [mattermost]
    verify_role_tasks: [verify.yml]
    service_names: [mattermost-pod, mattermost-svc, mattermost-db]
    service_ports: [8065]

  grafana:
    roles: [grafana]
    verify_role_tasks: [verify.yml]
    service_names: [grafana-pod, grafana-svc]
    service_ports: [3000]

  gitea:
    roles: [gitea]
    verify_role_tasks:
      - initialize-gitea
      - verify.yml
    service_names: [gitea-pod, gitea-svc]
    service_ports: [3001, 2222]

  mongodb:
    roles: [mongodb]
    verify_role_tasks: [verify.yml]
    service_names: [mongodb-pod, mongodb-svc, mongodb-gui]
    service_ports: [27017, 8081]

  influxdb3:
    roles: [influxdb3]
    verify_role_tasks: [verify.yml]
    service_names: [influxdb3-pod, influxdb3-svc]
    service_ports: [8087]

  obsidian:
    roles: [obsidian]
    verify_role_tasks: [verify.yml]
    service_names: [obsidian-pod, obsidian-svc]
    service_ports: [3010, 3011]

  conduit:
    roles: [conduit]
    verify_role_tasks: [verify.yml]
    service_names: [conduit-pod, conduit-svc]
    service_ports: [6167]
