---
- name: Display all_verify_results keys
  debug:
    msg: "Available result keys: {{ all_verify_results.keys() | list }}"
    verbosity: 0

- name: Create consolidated report
  set_fact:
    final_report: |
      === Container Services Test Report ===
      Timestamp: {{ ansible_facts.date_time.iso8601 }}
      Distribution: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
      Services: {{ testing_services | join(', ') }}

      Pre-verify Diagnostics:
      {{ all_verify_results.preverify | default('not captured') }}

      Post-verify Diagnostics:
      {{ all_verify_results.postverify | default('not captured') }}

      Service Results:
      {% for svc in testing_services %}
      {{ svc }}: {{ 'FAILED' if hostvars[inventory_hostname][svc + '_verify_failed'] | default(false) else 'PASSED' }}
      {% endfor %}

- name: Save consolidated report
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    content: "{{ final_report }}"
    dest: "{{ report_root }}/{{ ansible_distribution | lower }}/consolidated_test_report.md"
    mode: "0644"
