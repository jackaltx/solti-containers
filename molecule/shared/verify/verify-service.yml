---
# Verify a single container service.
# Called from main.yml for each service in testing_services.
# Variable 'service' contains the service name (e.g., 'redis', 'gitea').
#
# verify_role_tasks is an ordered flat list — each entry is a tasks_from value.
# Tasks run in order; failure in any task marks the service as failed.

- name: "Debug service verification for {{ service }}"
  debug:
    msg:
      - "Verifying service: {{ service }}"
      - "Tasks: {{ container_services[service].verify_role_tasks | default([]) }}"
    verbosity: 0

- name: "Run verification tasks for {{ service }}"
  include_role:
    name: "{{ project_root }}/roles/{{ service }}"
    tasks_from: "{{ task }}"
  loop: "{{ container_services[service].verify_role_tasks | default([]) }}"
  loop_control:
    loop_var: task
    label: "{{ service }}/{{ task }}"
  ignore_errors: true
  register: service_verify_result

- name: "Record {{ service }} verification result"
  set_fact:
    "{{ service }}_verify_failed": >-
      {{ (service_verify_result.results | default([])
          | selectattr('failed', 'equalto', true)
          | list | length) > 0 }}

- name: "Save {{ service }} verify snapshot"
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    content: "{{ lookup('vars', service + '_verify_status', default={}) | to_nice_yaml }}"
    dest: "{{ obsidian_run_dir }}/{{ service }}-verify-snapshot.yml"
    mode: "0644"
  when:
    - obsidian_run_dir is defined
    - lookup('vars', service + '_verify_status', default={}) | length > 0
