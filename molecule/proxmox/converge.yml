---
# Converge: prepare state then deploy state — both via direct role invocation.
# No svc-manage.sh wrapper. Variables flow through the real Ansible stack.
# dns_service omitted here — *_svc_name vars require the linked inventory (deferred).
#
# become: true at play level; roles manage their own become: false for user tasks.

- name: Prepare services (SELinux contexts, dirs, sysctl)
  hosts: podma
  become: true

  tasks:
    - name: Set verify timestamp (shared with verify phase)
      ansible.builtin.set_fact:
        verify_timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        cacheable: true

    - name: Set prepare state for each service
      ansible.builtin.set_fact:
        "{{ item }}_state": "prepare"
      loop: "{{ testing_services }}"

    - name: Prepare service
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/{{ item }}"
      loop: "{{ testing_services }}"

- name: Deploy services (quadlets + systemd)
  hosts: podma
  become: true

  tasks:
    - name: Set present state for each service
      ansible.builtin.set_fact:
        "{{ item }}_state": "present"
      loop: "{{ testing_services }}"

    - name: Deploy service
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/{{ item }}"
      loop: "{{ testing_services }}"
