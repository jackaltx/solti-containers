---
# Prepare: two-stage removal for a clean slate.
#
# Stage 1 — stop services, remove quadlets (rootless, become: false in _base)
# Stage 2 — delete data directories (become: true in _base, requires services stopped)
#
# Single-stage DELETE_DATA fails because _base defaults hard-code
# service_properties.delete_data: false (hash_behavior:replace overwrites the
# role's env-lookup value). Running as two separate svc-manage.sh calls
# works because each call is a fresh subprocess with its own env evaluation.
#
# Note: runs on localhost, calls svc-manage.sh targeting podma.
#       SMELL: podma is hardcoded — may need env var later.

- name: Two-stage removal for clean slate
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    testing_services: "{{ lookup('env', 'MOLECULE_SERVICES', default='redis,traefik') | split(',') }}"
    project_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

  tasks:
    - name: Stop services and remove quadlets (rootless)
      ansible.builtin.command:
        cmd: >
          {{ project_root }}/svc-manage.sh
          -y -h podma
          -i {{ project_root }}/inventory/podma.yml
          {{ item }} remove
        chdir: "{{ project_root }}"
      loop: "{{ testing_services }}"
      register: stop_result
      changed_when: stop_result.rc == 0

    - name: Remove data directories (become:true, services now stopped)
      ansible.builtin.command:
        cmd: >
          {{ project_root }}/svc-manage.sh
          -y -h podma
          -i {{ project_root }}/inventory/podma.yml
          {{ item }} remove
        chdir: "{{ project_root }}"
      environment:
        DELETE_DATA: "true"
      loop: "{{ testing_services }}"
      register: delete_result
      changed_when: delete_result.rc == 0
