---
# Prepare: remove services and data for a clean slate.
# Calls roles directly — no svc-manage.sh wrapper.
# become: true at play level; roles use become: false internally for user-level tasks.

- name: Remove services and data (clean slate)
  hosts: podma
  become: true

  tasks:
    - name: Set absent state with data deletion for each service
      ansible.builtin.set_fact:
        "{{ item }}_state": "absent"
        "{{ item }}_delete_data": true
      loop: "{{ testing_services }}"

    - name: Remove service and data
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/{{ item }}"
      loop: "{{ testing_services }}"
