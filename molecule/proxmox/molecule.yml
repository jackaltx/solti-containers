---
# Molecule scenario: proxmox
#
# Targets the existing podma test host directly — no VM provisioning.
# Playbooks use direct role invocation — no svc-manage.sh wrapper.
#
# Inventory strategy:
#   links.hosts      → inventory/podma.yml (group structure + *_svc_name host vars)
#   links.group_vars → inventory/group_vars/ (domain, test_*, service_network, etc.)
#   extra_vars       → molecule-only vars; also provides 'domain' at inventory
#                      load time so ansible_host: "podma.{{ domain }}" resolves
#   host_vars.podma  → connection details (explicit, no Jinja2)
#
# Flow:
#   prepare:  include_role _state=absent         ← clean slate
#   converge: include_role _state=prepare then present
#   verify:   shared/verify/main.yml             ← role verify tasks direct on podma
#   cleanup:  include_role _state=absent + direct file removal
#
# Usage:
#   source ~/.secrets/LabProvision
#   MOLECULE_SERVICES=redis molecule test -s proxmox
#   MOLECULE_SERVICES=redis,traefik molecule converge -s proxmox

driver:
  name: default

platforms:
  - name: podma

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: ../shared/verify/main.yml
    cleanup: cleanup.yml
  log: true
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    MOLECULE_PLATFORM_NAME: "podma"
  extra_vars:
    domain: "${LAB_TLD}"
    secure_logging: true
  config_options:
    defaults:
      interpreter_python: auto_silent
      host_key_checking: false
  inventory:
    links:
      hosts: ../../inventory/podma.yml
      group_vars: ../../inventory/group_vars
    host_vars:
      podma:
        ansible_host: "podma.${LAB_TLD}"
        ansible_user: lavender
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        ansible_connection: ssh

scenario:
  name: proxmox
  test_sequence:
    - prepare
    - converge
    - verify
    - cleanup

verifier:
  name: ansible
