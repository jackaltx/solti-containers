---
# Molecule scenario: proxmox
#
# Targets the existing podma test host directly — no VM provisioning.
# Playbooks call svc-manage.sh to reuse proven lifecycle logic.
#

# Flow — proves idempotency of all three states and both remove variants:
#
#   prepare:  remove (DELETE_DATA)          ← clean slate, nothing left from prior runs
#   converge: prepare state → deploy state  ← fresh dirs/SELinux, then containers up
#   verify:   shared/verify/main.yml         ← role verify.yml direct on podma (right layer)
#   cleanup:  remove (preserve data)        ← stop containers, keep data dirs
#             verify stopped               ← confirm services are down
#             remove (DELETE_DATA)          ← full wipe
#             verify removed               ← confirm data dirs gone
#
# Usage:
#   source ~/.secrets/LabProvision
#   MOLECULE_SERVICES=redis molecule test -s proxmox
#   MOLECULE_SERVICES=redis,traefik molecule converge -s proxmox

driver:
  name: default

platforms:
  - name: podma

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: ../shared/verify/main.yml
    cleanup: cleanup.yml
  log: true
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
  config_options:
    defaults:
      interpreter_python: auto_silent
      host_key_checking: false
  inventory:
    links:
      hosts: ../../inventory/podma.yml
    group_vars:
      all:
        ansible_managed: "Ansible managed"
        project_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        report_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/verify_output"
        secure_logging: "{{ lookup('env', 'MOLECULE_SECURE_LOGGING', default='true') | bool }}"
        testing_services: "{{ lookup('env', 'MOLECULE_SERVICES', default='redis,traefik') | split(',') }}"
        domain: "{{ lookup('env', 'LAB_TLD', default='example.com') }}"

scenario:
  name: proxmox
  test_sequence:
    - prepare
    - converge
    - verify
    - cleanup

verifier:
  name: ansible
