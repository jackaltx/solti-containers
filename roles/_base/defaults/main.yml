---
# User context for rootless containers
# ansible_user comes from inventory (lavender, jackaltx, etc.)
# NOT affected by become escalation
real_user: "{{ ansible_user }}"
real_user_dir: "{{ ('~' + ansible_user) | expanduser }}"
# Note: real_user_uid will be set dynamically by getent in tasks when needed for XDG_RUNTIME_DIR
real_user_uid: "{{ ansible_facts.getent_passwd[ansible_user][1] if ansible_facts.getent_passwd is defined else lookup('pipe', 'id -u ' + ansible_user) }}"

# Container networking
service_network: "ct-net"
service_dns_servers:
  - "1.1.1.1"
  - "8.8.8.8"
service_dns_search: "example.com"

service_quadlet_dir: "{{ real_user_dir }}/.config/containers/systemd"

# Matrix event notification (optional)
matrix_notify_enabled: "{{ lookup('env', 'MATRIX_NOTIFY_ENABLED') | default('false') }}"
matrix_homeserver_url: "{{ lookup('env', 'MATRIX_HOMESERVER_URL') | default('') }}"
matrix_access_token: "{{ lookup('env', 'MATRIX_ACCESS_TOKEN') | default('') }}"
matrix_room_id: "{{ lookup('env', 'MATRIX_ROOM_ID') | default('') }}"

# _base/defaults/main.yml
service_properties:
  root: ""  # Service name (e.g., "elasticsearch")
  name: ""  # Systemd service name (e.g., "elasticsearch-pod")
  pod_key: ""  # Pod reference (e.g., "elasticsearch.pod")
  quadlets: []  # List of quadlet files
  data_dir: ""  # Main data directory
  config_dir: "config"  # Config subdirectory
  delete_data: false  # Whether to delete data on removal (override via DELETE_DATA env var)
  image: ""  # Main container image
  gui_image: ""  # GUI container image (if applicable)
  dirs: []  # Required directories with permissions
  ports: []  # Port mappings
  volumes: []  # Volume mappings
  environment: {}  # Environment variables
  command: []  # Container command (if overriding default)
