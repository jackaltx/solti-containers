---
# Obsidian container service - main entry point

- name: Validate state parameter
  ansible.builtin.fail:
    msg: "obsidian_state must be one of: prepare, present, absent"
  when: obsidian_state not in ['prepare', 'present', 'absent']

# =======================================================================
# PREPARATION (one-time setup)
# =======================================================================

- name: Prepare Obsidian (one-time setup)
  when: obsidian_state == 'prepare'
  block:
    - name: Check if already prepared
      ansible.builtin.stat:
        path: "{{ obsidian_data_dir }}"
      register: data_dir_check

    - name: Fail if already prepared
      ansible.builtin.fail:
        msg: "Obsidian appears to be already prepared. Directory {{ obsidian_data_dir }} exists."
      when: data_dir_check.stat.exists

    - name: Base prepare
      ansible.builtin.include_tasks:
        file: ../_base/tasks/prepare.yml

    - name: Set deployment success
      set_fact:
        deployment_status: "success"

  rescue:
    - name: Capture prepare failure details
      set_fact:
        deployment_status: "failed"
        deployment_error: "{{ ansible_failed_result.msg | default('Unknown error during prepare') }}"
        deployment_task: "{{ ansible_failed_task.name | default('Unknown task') }}"
        deployment_result: "{{ ansible_failed_result | default({}) }}"

# =======================================================================
# DEPLOYMENT
# =======================================================================

- name: Install Obsidian
  when: obsidian_state == 'present'
  block:
    - name: Check if directories exist
      ansible.builtin.stat:
        path: "{{ obsidian_data_dir }}/{{ service_properties.config_dir }}"
      register: config_dir_check
      changed_when: false

    - name: Auto-prepare if directories don't exist (for molecule/testing)
      ansible.builtin.include_tasks: prepare.yml
      when: not config_dir_check.stat.exists

    - name: Include prerequisites tasks
      ansible.builtin.include_tasks: prerequisites.yml

    - name: Ensure network setup
      ansible.builtin.include_tasks:
        file: "../_base/tasks/networks.yml"

    - name: Include container tasks
      ansible.builtin.include_tasks: quadlet_rootless.yml

    - name: Set deployment success
      set_fact:
        deployment_status: "success"

  rescue:
    - name: Capture deployment failure details
      set_fact:
        deployment_status: "failed"
        deployment_error: "{{ ansible_failed_result.msg | default('Unknown error during deployment') }}"
        deployment_task: "{{ ansible_failed_task.name | default('Unknown task') }}"
        deployment_result: "{{ ansible_failed_result | default({}) }}"

# =======================================================================
# CLEANUP
# =======================================================================

- name: Remove Obsidian
  when: obsidian_state == 'absent'
  block:
    - name: Include cleanup tasks
      ansible.builtin.include_tasks:
        file: "../_base/tasks/cleanup.yml"
      vars:
        service_state: absent

    - name: Set deployment success
      set_fact:
        deployment_status: "success"

  rescue:
    - name: Capture cleanup failure details
      set_fact:
        deployment_status: "failed"
        deployment_error: "{{ ansible_failed_result.msg | default('Unknown error during cleanup') }}"
        deployment_task: "{{ ansible_failed_task.name | default('Unknown task') }}"
        deployment_result: "{{ ansible_failed_result | default({}) }}"

# =======================================================================
# MATRIX EVENT
# =======================================================================
- name: send matrix event
  ansible.builtin.include_tasks:
    file: "../_base/tasks/matrix_event.yml"
