---
# Installation state
hashivault_state: present
vault_force_reload: false

# User context for rootless containers (inherited from _base, but defined here for defaults evaluation)
# ansible_user comes from inventory (lavender, jackaltx, etc.)
real_user: "{{ ansible_user }}"
real_user_dir: "{{ ('~' + ansible_user) | expanduser }}"
real_user_uid: "{{ ansible_facts.getent_passwd[ansible_user][1] if ansible_facts.getent_passwd is defined else lookup('pipe', 'id -u ' + ansible_user) }}"

# TLS Configuration
# -- Plan is to put this in a private network and use traefik for TLS
vault_enable_tls: false
vault_tls_cert_file: ""
vault_tls_key_file: ""
vault_tls_ca_file: ""
vault_tls_min_version: "tls12"

# Container settings
vault_image: "docker.io/hashicorp/vault:1.15"
vault_ui_image: "docker.io/hashicorp/vault-ui:latest" # If using separate UI container
vault_api_port: 8200
vault_cluster_port: 8201
vault_ui_port: 8200 # Same as API port when using integrated UI

# Directory_settings
vault_data_dir: "{{ real_user_dir }}/vault-data"

# Service naming and URL construction
hashivault_svc_name: "vault" # Override per host in inventory (primary route)
hashivault_alt_svc_name: "hashivault" # Override per host in inventory (alternate route)
hashivault_fqdn: "{{hashivault_svc_name}}.{{domain}}"
hashivault_fqdn_alt: "{{hashivault_alt_svc_name}}.{{domain}}"
hashivault_external_port: 8080 # Port users access through Traefik
hashivault_external_url: "https://{{hashivault_fqdn}}:{{hashivault_external_port}}"
hashivault_external_url_alt: "https://{{hashivault_fqdn_alt}}:{{hashivault_external_port}}"

# Traefik integration
hashivault_enable_traefik: true

# Security settings
vault_enable_ui: true
vault_initial_root_token: "" # Generated on first init if not provided
vault_enable_audit: true

# Admin credentials - VAULT_ADMIN_PASSWORD env var must be set
vault_admin_username: "admin"
vault_admin_password: "{{ lookup('env', 'VAULT_ADMIN_PASSWORD') | mandatory('VAULT_ADMIN_PASSWORD environment variable must be set before running configure') }}"

# Auth and configure settings
vault_addr: "http://localhost:{{ vault_api_port }}"
vault_enable_userpass: true
vault_enable_approle: true
vault_policies:
  - name: "admin"
    rules: |
      path "*" {
        capabilities = ["create", "read", "update", "delete", "list", "sudo"]
      }
  - name: "readonly"
    rules: |
      path "kv/*" {
        capabilities = ["read", "list"]
      }

# Secret engines
vault_enable_transit: true
vault_enable_pki: true
vault_enable_ssh: false
vault_pki_max_ttl: "87600h"
vault_pki_common_name: "{{ domain }}"
vault_initial_secrets: []

# Initialization settings
vault_init_required: true
vault_key_shares: 5
vault_key_threshold: 3
vault_unseal_now: true
vault_keys_backup: true
vault_keys_output_dir: "{{ real_user_dir }}/.secrets/vault-secrets"
vault_keys_file: "{{ vault_keys_output_dir }}/vault-keys.json"
vault_keys_dir: "{{ vault_keys_output_dir }}"

# Storage settings
vault_storage_type: "file" # Options: file, raft, consul
vault_raft_node_id: "node1"
vault_raft_retry_join: [] # List of raft peer addresses

# =======================================================================
service_network: "example-net"
service_dns_servers:
  - "1.1.1.1"
  - "8.8.8.8"
service_dns_search: "example.com"

# =======================================================================
service_properties:
  root: "vault"
  name: "vault-pod"
  pod_key: "vault.pod"
  quadlets:
    - "vault-svc.container"
    - "vault.pod"
  data_dir: "{{vault_data_dir}}" # override in playbook
  config_dir: "config"
  delete_data: "{{lookup('env', 'DELETE_DATA') | default(false) | bool}}"
  delete_images: "{{lookup('env', 'DELETE_IMAGES') | default(false) | bool}}"
  container_image: "{{vault_image}}"
  dirs:
    - { path: "", mode: "0755" }
    - { path: "config", mode: "0755" }
    - { path: "data", mode: "0755" }
    - { path: "logs", mode: "0755" }
    - { path: "tls", mode: "0755" }
