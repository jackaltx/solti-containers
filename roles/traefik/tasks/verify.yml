---
- name: Verify Traefik pod is running
  command: podman pod ps --format {% raw %}"{{.Name}}"{% endraw %}
  register: pod_status
  failed_when: "'traefik' not in pod_status.stdout"
  changed_when: false

- name: Show pod status
  debug:
    var: pod_status.stdout_lines

- name: Verify Traefik container is running
  command: podman ps --format {% raw %}"{{.Names}}"{% endraw %} --filter "pod=traefik"
  register: container_status
  failed_when: "'traefik' not in container_status.stdout"
  changed_when: false

- name: Show container status
  debug:
    var: container_status.stdout_lines

- name: Check Traefik API health
  uri:
    url: "http://127.0.0.1:{{ traefik_dashboard_port }}/api/rawdata"
    return_content: true
  register: health_check
  ignore_errors: true

- name: Show health check result
  debug:
    var: health_check

- name: Verify network configuration
  command: podman network inspect {{ service_network }}
  register: network_info
  changed_when: false

- name: Show network info
  debug:
    var: network_info.stdout_lines

- name: Check ACME configuration
  stat:
    path: "{{ traefik_data_dir }}/acme/acme.json"
  register: acme_file

- name: Show ACME file status
  debug:
    msg: "ACME file exists: {{ acme_file.stat.exists }}"

# ...................................................................................
- name: Gather verification results
  ansible.builtin.set_fact:
    traefik_verify_status:
      timestamp: "{{ verify_timestamp | default(ansible_date_time.iso8601) }}"
      pod_running: "{{ 'traefik' in pod_status.stdout }}"
      container_running: "{{ 'traefik' in container_status.stdout }}"
      api_accessible: "{{ health_check.status | default('unknown') }}"
      router_count: "{{ (health_check.content | from_json).routers | default({}) | length if health_check.status | default(0) == 200 else 'unknown' }}"
      acme_file_exists: "{{ acme_file.stat.exists }}"
      network_exists: "{{ network_info.rc == 0 }}"

- name: Display verification summary
  ansible.builtin.debug:
    msg:
      - "=== Traefik Verification ==="
      - "Pod: {{ traefik_verify_status.pod_running }} / container: {{ traefik_verify_status.container_running }}"
      - "API: {{ traefik_verify_status.api_accessible }}, routers: {{ traefik_verify_status.router_count }}"
      - "ACME: {{ traefik_verify_status.acme_file_exists }}, network: {{ traefik_verify_status.network_exists }}"
