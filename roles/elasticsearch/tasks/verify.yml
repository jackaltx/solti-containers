---
# ...................................................................................
- name: Verify Elasticsearch pod is running
  command: podman pod ps --format {% raw %}"{{.Name}}"{% endraw %}
  register: pod_status
  failed_when: "'elasticsearch' not in pod_status.stdout"
  changed_when: false

- name: Show pod status
  debug:
    var: pod_status.stdout_lines

# ...................................................................................
- name: Verify Elasticsearch containers are running
  command: podman ps --format {% raw %}"{{.Names}}"{% endraw %} --filter "pod=elasticsearch"
  register: container_status
  # failed_when: "'elasticsearch-svc' not in container_status.stdout"
  changed_when: false

- name: Show container status
  debug:
    var: container_status.stdout_lines

# ...................................................................................
- name: Wait for Elasticsearch to be ready
  command: >
    podman exec elasticsearch-svc
    curl -s -u elastic:{{ elasticsearch_password }}
    http://localhost:9200/_cluster/health
  register: health_check
  until: health_check.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  no_log: true

# ...................................................................................
- name: Show cluster health
  command: >
    podman exec elasticsearch-svc
    curl -s -u elastic:{{ elasticsearch_password }}
    http://localhost:9200/_cluster/health?pretty
  register: cluster_health
  changed_when: false
  no_log: true

- name: Display cluster health
  debug:
    var: cluster_health.stdout_lines

# ...................................................................................
- name: Get Elasticsearch info
  command: >
    podman exec elasticsearch-svc
    curl -s -u elastic:{{ elasticsearch_password }}
    http://localhost:9200/?pretty
  register: es_info
  changed_when: false
  no_log: true

- name: Display Elasticsearch info
  debug:
    var: es_info.stdout_lines

# ...................................................................................
- name: Create test document
  uri:
    url: "http://localhost:9200/{{ test_index }}/_doc?refresh=true"
    method: POST
    user: elastic
    password: "{{ elasticsearch_password }}"
    body_format: json
    body:
      message: "Verification {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
    force_basic_auth: true
    status_code: 201
  register: index_result
  changed_when: false
  no_log: true

- name: Show index result
  debug:
    var: index_result.json

# ...................................................................................
- name: Search test document
  command: >
    podman exec elasticsearch-svc
    curl -s -u elastic:{{ elasticsearch_password }}
    "http://localhost:9200/{{ test_index }}/_search?pretty"
  register: search_result
  changed_when: false
  no_log: true

- name: Show search result
  debug:
    var: search_result.stdout_lines

# ...................................................................................
- name: Get memory stats
  command: >
    podman exec elasticsearch-svc
    curl -s -u elastic:{{ elasticsearch_password }}
    http://localhost:9200/_nodes/stats/jvm?pretty
  register: memory_stats
  changed_when: false
  no_log: true

- name: Show memory usage
  debug:
    msg: "{{ memory_stats.stdout | from_json | json_query('nodes.*.jvm.mem.heap_used_percent') }}"

# ...................................................................................
# Cleanup
- name: Delete test index
  command: >
    podman exec elasticsearch-svc
    curl -s -u elastic:{{ elasticsearch_password }}
    -X DELETE "http://localhost:9200/{{ test_index }}"
  changed_when: false
  no_log: true

# ...................................................................................
- name: Gather verification results
  ansible.builtin.set_fact:
    elasticsearch_verify_status:
      timestamp: "{{ verify_timestamp | default(now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}"
      pod_running: "{{ 'elasticsearch' in pod_status.stdout }}"
      container_running: "{{ 'elasticsearch-svc' in container_status.stdout }}"
      cluster_status: "{{ (cluster_health.stdout | from_json).status | default('unknown') }}"
      number_of_nodes: "{{ (cluster_health.stdout | from_json).number_of_nodes | default('unknown') }}"
      active_shards: "{{ (cluster_health.stdout | from_json).active_shards | default('unknown') }}"
      version: "{{ (es_info.stdout | from_json).version.number | default('unknown') }}"
      heap_used_percent: "{{ (memory_stats.stdout | from_json).nodes.values() | map(attribute='jvm.mem.heap_used_percent') | list | first | default('unknown') }}"
      index_write_status: "{{ index_result.status | default('skipped') }}"
      index_search_rc: "{{ search_result.rc | default('skipped') }}"

- name: Display verification summary
  ansible.builtin.debug:
    msg:
      - "=== Elasticsearch Verification ==="
      - "Pod: {{ elasticsearch_verify_status.pod_running }} / container: {{ elasticsearch_verify_status.container_running }}"
      - "Cluster: {{ elasticsearch_verify_status.cluster_status }} ({{ elasticsearch_verify_status.number_of_nodes }} nodes, {{ elasticsearch_verify_status.active_shards }} shards)"
      - "Version: {{ elasticsearch_verify_status.version }}, Heap: {{ elasticsearch_verify_status.heap_used_percent }}%"
      - "Data test: write={{ elasticsearch_verify_status.index_write_status }}, search={{ elasticsearch_verify_status.index_search_rc }}"
